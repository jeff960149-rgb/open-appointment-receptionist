name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python scripts/check_public_files.py
      - run: python -m compileall -q receptionist reference
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t receptionist-test .
      - run: |
          docker run -d --name receptionist-test -p 8000:8000 receptionist-test
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs receptionist-test
          exit 1
